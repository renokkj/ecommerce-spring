services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ${DATABASE_USERNAME:-ecommerce}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-ecommerce} -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ecommerce
      DATABASE_USERNAME: ${DATABASE_USERNAME:-ecommerce}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ecommerce}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
